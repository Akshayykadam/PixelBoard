name: Build & Test PixelBoard Patches

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x pixelboard-patches/gradlew

      - name: Run Unit Tests & Wiring Verification
        run: |
          cd pixelboard-patches
          ./gradlew test --info

      - name: Build Android Patch Bundle (.mpp)
        run: |
          cd pixelboard-patches
          ./gradlew :patches:buildAndroid

      - name: Upload Compiled Patch Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixelboard-patches-bundle
          path: pixelboard-patches/patches/build/libs/*.mpp
